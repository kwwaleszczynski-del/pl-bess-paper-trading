[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pl-bess-paper-trading"
version = "0.1.0"
description = "Paper trading of a 1 MW / 2 MWh battery on the Polish day-ahead market: price forecast before gate closure, MILP schedule, next-day settlement and an append-only live track record."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "requests>=2.31",
    "pse-opendata @ git+https://github.com/kwwaleszczynski-del/pse-opendata@8b01ec882b6f3af9c9ea91308293dda64108d705",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bess-paper = "bess_paper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bess_paper = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning"]
